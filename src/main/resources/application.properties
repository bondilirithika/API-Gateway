spring.application.name=API-Gateway

# Enable JSON formatting from the logging jar
zenv.logging.json-format=true

# Enable request tracking
zenv.logging.trace.enabled=true
# Configure trace ID header name
zenv.logging.trace.header=X-Trace-ID

# Enable bean definition overriding to use logging jar's configuration
spring.main.allow-bean-definition-overriding=true

# Set logging levels
logging.level.root=INFO
logging.level.com.zenvlog=DEBUG
logging.level.com.zenv.logging=DEBUG
logging.level.com.example.demo=DEBUG

# Configure web logging
logging.level.web=DEBUG

# Configure log pattern to include trace context only when present
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Logging module configuration
zenv.logging.packages=com.example.demo,com.zenv

# File logging configuration
logging.file.name=logs/app.log
logging.file.path=logs
logging.file.max-size=10MB
logging.file.max-history=10

server.port=8081
